services:
  routewise:
    build:
      context: .
      dockerfile: Dockerfile
    image: routewise:latest
    container_name: routewise_app
    ports:
      - "5050:5000"
    environment:
      - PORT=5000
      - ROUTEWISE_OFFLINE=1
      - OSRM_BASE_URL=https://router.project-osrm.org
      - OSRM_TIMEOUT_SECONDS=10
    restart: unless-stopped
